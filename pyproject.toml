[project]
name = "legkyi-zvit"
version = "1.0.0"
description = "Легкий звіт — щомісячні товарні звіти з кількох магазинів"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "sqlmodel>=0.0.48",
    "sqlalchemy>=2.0.55",
    "psycopg[binary]>=3.3.6",
    "itsdangerous>=2.2.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "pydantic>=2.14.1",
    "starlette>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend/app"]

[tool.pytest.ini_options]
testpaths = ["src/backend/tests"]
python_files = ["test_*.py"]
pythonpath = ["src/backend"]
addopts = "-p no:cacheprovider -ra"
