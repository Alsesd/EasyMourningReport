[project]
name = "legkyi-zvit"
version = "1.0.0"
description = "Легкий звіт — щомісячні товарні звіти з кількох магазинів"
requires-python = ">=3.10,<4.0"

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel==0.0.24",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["backend/app/tests"]
python_files = ["test_*.py"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.uv]
# This repository runs the application from backend/; it is not a distributable Python package.
package = false
