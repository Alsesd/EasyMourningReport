[tool.poetry]
name = "sales-reports"
version = "0.9.0"
description = "Monthly sold-goods reports from several stores"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115"
uvicorn = ">=0.30"
sqlalchemy = ">=2.0"
jinja2 = ">=3.1"
python-multipart = ">=0.0.9"
itsdangerous = ">=2.2"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "nuitka (>=4.2.2,<5.0.0)",
    "zstandard (>=0.25.0,<0.26.0)"
]
