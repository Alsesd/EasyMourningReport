[tool.poetry]
name = "legkyi-zvit"
version = "1.0.0"
description = "Легкий звіт — щомісячні товарні звіти з кількох магазинів"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = ">=0.115"
uvicorn = ">=0.30"
sqlmodel = "0.0.24"
sqlalchemy = ">=2.0"
jinja2 = ">=3.1"
python-multipart = ">=0.0.9"
itsdangerous = ">=2.2"
openpyxl = ">=3.1.5"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=6.0"
httpx = ">=0.27"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"
