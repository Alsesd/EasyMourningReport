name: Windows single-file build

on:
  workflow_dispatch:
  push:
    branches:
      - fix/windows-binary-reliability-tailscale

permissions:
  contents: read

concurrency:
  group: windows-onefile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build and verify packaged server startup
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Go for bundled Tailscale helper
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: tailscale-helper/go.mod

      - name: Compile Tailscale helper
        shell: pwsh
        working-directory: tailscale-helper
        run: |
          go mod download
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          go build -trimpath -ldflags "-s -w" -o bin/tailscale-helper.exe .

      - name: Install runtime and freezer
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.115.12 uvicorn==0.34.0 sqlmodel==0.0.24 sqlalchemy==2.0.40 jinja2==3.1.6 python-multipart==0.0.20 itsdangerous==2.2.0 openpyxl==3.1.5 pyinstaller==6.16.0

      - name: Build single-file Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name LegkyiZvit --add-data "app/templates;app/templates" --add-data "app/static;app/static" --add-binary "tailscale-helper/bin/tailscale-helper.exe;." --collect-all openpyxl --hidden-import app.__main__ app/__main__.py
          if (!(Test-Path "dist/LegkyiZvit.exe")) { throw "PyInstaller did not produce dist/LegkyiZvit.exe" }
          if ((Get-Item "dist/LegkyiZvit.exe").Length -le 1MB) { throw "Executable is unexpectedly small; refusing to publish incomplete output" }

      - name: Verify packaged server starts
        shell: pwsh
        run: |
          $env:HOST = "127.0.0.1"
          $env:PORT = "18765"
          $env:LEGKYI_DATA_DIR = Join-Path $env:RUNNER_TEMP "legkyi-data"
          $proc = Start-Process -FilePath "dist/LegkyiZvit.exe" -PassThru -WorkingDirectory "$PWD"
          try {
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              if ($proc.HasExited) { throw "Packaged server exited early with code $($proc.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:18765/" -TimeoutSec 2 -UseBasicParsing
                if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (!$ready) { throw "Packaged server did not begin listening on 127.0.0.1:18765 within 45 seconds" }
            Write-Host "Packaged executable is running and HTTP server is responding."
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Upload single-file executable
        uses: actions/upload-artifact@v4
        with:
          name: LegkyiZvit-Windows-x64
          path: dist/LegkyiZvit.exe
          if-no-files-found: error
          retention-days: 30
