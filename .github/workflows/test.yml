name: CI

on:
  push:
    branches: [main, master, restructure, rewrite/sqlmodel-clean-architecture]
  pull_request:
    branches: [main, master, restructure]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and compile
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn sqlmodel sqlalchemy jinja2 python-multipart itsdangerous "openpyxl>=3.1.5" "coverage>=7.6"

      - name: Run tests with branch coverage
        run: |
          python -m coverage run --branch -m unittest discover -s tests -v
          python -m coverage html
          python -m coverage report -m --fail-under=100

      - name: Compile Python sources
        run: python -m compileall -q app run.py tests

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-coverage
          path: htmlcov/
          if-no-files-found: ignore
