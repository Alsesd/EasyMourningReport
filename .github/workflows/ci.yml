name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    name: Test and Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDM
        run: pip install pdm

      - name: Install dependencies
        run: pdm install

      - name: Run test suite
        run: pdm run pytest

      - name: Build App Docker Image
        run: docker build -t legkyi-zvit:latest .

      - name: Build Tunnel Docker Image
        run: docker build -f Dockerfile.tunnel -t legkyi-zvit-tunnel:latest .
