name: Windows package (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-build
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Prepare Windows environment and test
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      LEGKYI_DATA_DIR: ${{ runner.temp }}\LegkyiZvit-test-data
      SECRET_KEY: test-only-secret-key-for-ci
      HOST: 127.0.0.1
      PORT: "8765"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare Windows Python and restore pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
- name: Install runtime and pytest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.115.12 uvicorn==0.34.0 sqlmodel==0.0.24 sqlalchemy==2.0.40 jinja2==3.1.6 python-multipart==0.0.20 itsdangerous==2.2.0 openpyxl==3.1.5 pytest==8.3.5 pytest-cov==6.0.0 httpx==0.28.1

      - name: Quality gate — pytest, FastAPI integration tests, and 95% branch coverage
        run: python -m pytest

  build-windows:
    name: Build and smoke-test the packaged application
    needs: quality-gate
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare Windows Python and restore pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
- name: Install pinned runtime and PyOxidizer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.115.12 uvicorn==0.34.0 sqlmodel==0.0.24 sqlalchemy==2.0.40 jinja2==3.1.6 python-multipart==0.0.20 itsdangerous==2.2.0 openpyxl==3.1.5 pyoxidizer==0.24.0

      - name: Build complete Windows distribution
        run: python build.py --target-triple x86_64-pc-windows-msvc

      - name: Smoke test executable, web assets, and persistent data
        shell: pwsh
        env:
          HOST: 127.0.0.1
          PORT: "8765"
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $exe = Join-Path $dist 'LegkyiZvit.exe'
          if (-not (Test-Path $exe)) { throw "Executable missing: $exe" }
          foreach ($asset in 'app\templates\login.html', 'app\static\app.css', 'app\static\icon.svg', 'app\static\apple-touch-icon.png', 'app\static\manifest.webmanifest') {
            if (-not (Test-Path (Join-Path $dist $asset))) { throw "Packaged asset missing: $asset" }
          }

          $stdout = Join-Path $env:RUNNER_TEMP 'packaged-app.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'packaged-app.err.log'
          function Start-PackagedApp {
            Start-Process -FilePath $exe -WorkingDirectory $dist -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          }
          function Wait-ForLogin($process) {
            for ($i = 0; $i -lt 60; $i++) {
              if ($process.HasExited) {
                $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
                $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
                throw "Packaged app exited with $($process.ExitCode). Logs:`n$out`n$err"
              }
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:8765/login' -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content.Contains('Увійдіть')) { return $response }
              } catch { }
              Start-Sleep -Seconds 2
            }
            throw 'Packaged app did not serve /login within 120 seconds.'
          }
          function Stop-PackagedApp($process) {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }

          Remove-Item Env:LEGKYI_DATA_DIR -ErrorAction SilentlyContinue
          Remove-Item Env:SECRET_KEY -ErrorAction SilentlyContinue
          $first = Start-PackagedApp
          try {
            $page = Wait-ForLogin $first
            if ($page.Content -notmatch 'name="login"') { throw 'Login template was not rendered.' }
            $css = Invoke-WebRequest 'http://127.0.0.1:8765/static/app.css' -TimeoutSec 10
            if ($css.StatusCode -ne 200 -or $css.Content.Length -lt 100) { throw 'Packaged stylesheet is missing or empty.' }
            $manifest = Invoke-WebRequest 'http://127.0.0.1:8765/manifest.webmanifest' -TimeoutSec 10
            if ($manifest.StatusCode -ne 200 -or $manifest.Content -notmatch 'icon.svg') { throw 'PWA manifest or icon was not served correctly.' }
          } finally { Stop-PackagedApp $first }

          $database = Join-Path $dist 'reports.db'
          $secret = Join-Path $dist 'secret.key'
          if (-not (Test-Path $database)) { throw "Database was not created beside the executable: $database" }
          if (-not (Test-Path $secret)) { throw "Secret key was not created beside the executable: $secret" }
          $secretHash = (Get-FileHash $secret -Algorithm SHA256).Hash
          $second = Start-PackagedApp
          try { $null = Wait-ForLogin $second } finally { Stop-PackagedApp $second }
          if ((Get-FileHash $secret -Algorithm SHA256).Hash -ne $secretHash) {
            throw 'The secret key changed after restart; sessions would be invalidated.'
          }
          Write-Host 'OK: packaged app serves login, CSS, manifest, icons, and retains DB + secret.'
