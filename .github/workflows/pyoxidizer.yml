name: PyOxidizer package smoke test

on:
  push:
    branches: [restructure]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build and run packaged Windows app
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10 (PyOxidizer runtime compatibility)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PyOxidizer
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyoxidizer==0.24.0

      - name: Build complete distribution
        run: python build.py

      - name: Smoke test executable, web assets, and persistent data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $exe = Join-Path $dist 'LegkyiZvit.exe'
          if (-not (Test-Path $exe)) { throw "Executable missing: $exe" }
          foreach ($asset in 'lib\app\templates\login.html', 'lib\app\static\app.css') {
            if (-not (Test-Path (Join-Path $dist $asset))) { throw "Packaged asset missing: $asset" }
          }

          Remove-Item Env:LEGKYI_DATA_DIR -ErrorAction SilentlyContinue
          Remove-Item Env:SECRET_KEY -ErrorAction SilentlyContinue
          $env:HOST = '127.0.0.1'
          $env:PORT = '8765'
          $stdout = Join-Path $env:RUNNER_TEMP 'packaged-app.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'packaged-app.err.log'

          function Start-PackagedApp {
            Start-Process -FilePath $exe -WorkingDirectory $dist -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          }
          function Wait-ForLogin($process) {
            for ($i = 0; $i -lt 60; $i++) {
              if ($process.HasExited) {
                $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
                $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
                throw "Packaged app exited with $($process.ExitCode). Logs:`n$out`n$err"
              }
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:8765/login' -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content.Contains('Увійдіть')) { return $response }
              } catch { }
              Start-Sleep -Seconds 2
            }
            throw 'Packaged app did not serve /login within 120 seconds.'
          }
          function Stop-PackagedApp($process) {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }

          $first = Start-PackagedApp
          try {
            $page = Wait-ForLogin $first
            if ($page.Content -notmatch 'name="login"') { throw 'Login template was not rendered.' }
            $css = Invoke-WebRequest 'http://127.0.0.1:8765/static/app.css' -TimeoutSec 10
            if ($css.StatusCode -ne 200 -or $css.Content -notmatch '--accent:#176b55') {
              throw 'Packaged stylesheet was not served correctly.'
            }
          } finally { Stop-PackagedApp $first }

          $db = Join-Path $dist 'reports.db'
          $secret = Join-Path $dist 'secret.key'
          if (-not (Test-Path $db)) { throw "Database was not created beside the executable: $db" }
          if (-not (Test-Path $secret)) { throw "Secret key was not created beside the executable: $secret" }
          $secretHash = (Get-FileHash $secret -Algorithm SHA256).Hash
          $dbCheck = Join-Path $env:RUNNER_TEMP 'check_db.py'
          @'
          import sqlite3, sys
          connection = sqlite3.connect(sys.argv[1])
          count = connection.execute("select count(*) from sqlite_master where type='table' and name not like 'sqlite_%'").fetchone()[0]
          print(count)
          '@ | Set-Content -Path $dbCheck -Encoding utf8
          $tableCount = python $dbCheck $db
          if ([int]$tableCount -lt 1) { throw 'The database exists but the schema was not created.' }

          $second = Start-PackagedApp
          try { $null = Wait-ForLogin $second } finally { Stop-PackagedApp $second }
          if ((Get-FileHash $secret -Algorithm SHA256).Hash -ne $secretHash) {
            throw 'The secret key changed after restart; sessions would be invalidated.'
          }
          $tableCountAfter = python $dbCheck $db
          if ([int]$tableCountAfter -lt 1) { throw 'The database schema disappeared after restart.' }
          Write-Host "OK: packaged app served /login and CSS; DB + secret persisted in $dist."
