name: Windows package (manual)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-release-build
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows distribution
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare Windows Python and restore pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Go for the bundled Tailscale helper
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: tailscale-helper/go.mod

      - name: Build the embedded Tailscale helper
        shell: pwsh
        working-directory: tailscale-helper
        run: |
          go mod tidy
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          go build -o bin/tailscale-helper.exe .

      - name: Install pinned runtime and PyOxidizer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.115.12 uvicorn==0.34.0 sqlmodel==0.0.24 sqlalchemy==2.0.40 jinja2==3.1.6 python-multipart==0.0.20 itsdangerous==2.2.0 openpyxl==3.1.5 pyoxidizer==0.24.0 pytest pytest-cov httpx

      - name: Run regression tests
        run: python -m pytest -q

      - name: Build complete Windows distribution
        run: python build.py --target-triple x86_64-pc-windows-msvc

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
