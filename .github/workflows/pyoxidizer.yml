name: Windows package (manual)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - soupv2-fixes
    tags:
      - 'v*'
      - 'Soup.v*'

permissions:
  contents: write

concurrency:
  group: windows-release-build
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows distribution
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare Windows Python and restore pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned runtime and PyOxidizer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.115.12 uvicorn==0.34.0 sqlmodel==0.0.24 sqlalchemy==2.0.40 jinja2==3.1.6 python-multipart==0.0.20 itsdangerous==2.2.0 openpyxl==3.1.5 pyoxidizer==0.24.0

      - name: Run test suite
        run: |
          python -m pip install pytest==8.3.5 httpx==0.28.1
          python -m pytest -q

      - name: Build complete Windows distribution
        run: python build.py --target-triple x86_64-pc-windows-msvc

      - name: Create Windows release archive
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath dist\LegkyiZvit-windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/LegkyiZvit-windows-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
