name: Refresh Poetry lock (temporary)

on:
  push:
    branches:
      - packaging/nix-flake

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve dependencies from pyproject.toml
        run: |
          python -m pip install "poetry==2.4.3"
          poetry lock --no-interaction
      - name: Commit lockfile only when it changes
        run: |
          if ! git diff --quiet -- poetry.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add poetry.lock
            git commit -m "Refresh Poetry lock from pyproject.toml"
            git push origin HEAD:refs/heads/packaging/nix-flake
          fi
