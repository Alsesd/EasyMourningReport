name: Windows package (PyInstaller)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'Soup.v*'
  pull_request:

permissions:
  contents: write

concurrency:
  group: windows-release-build
  cancel-in-progress: false

jobs:
  build-windows:
    name: Test and build standalone Windows executable
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python and restore dependency cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install Poetry and locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.4.3"
          poetry lock --no-interaction
          poetry install --no-interaction
          poetry run python -m pip install "pyinstaller==6.16.0"

      - name: Download pinned Alpine runtime for offline-capable packaging
        shell: pwsh
        run: |
          $runtime = "app/static/alpine.min.js"
          Invoke-WebRequest -Uri "https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js" -OutFile $runtime
          if (!(Test-Path $runtime) -or (Get-Item $runtime).Length -lt 10000) {
            throw "Pinned Alpine runtime download failed or returned an incomplete file."
          }

      - name: Export refreshed Poetry lock for repository update
        if: github.event_name == 'pull_request' && github.head_ref == 'soupv2-fixes'
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-poetry-lock
          path: poetry.lock
          retention-days: 1

      - name: Run regression tests
        run: poetry run python -m pytest --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=95

      - name: Build single-file Windows executable
        shell: pwsh
        run: |
          poetry run pyinstaller --noconfirm --clean --onefile --console --name LegkyiZvit --add-data "app/templates;app/templates" --add-data "app/static;app/static" --collect-all fastapi --collect-all starlette --collect-all sqlmodel --collect-all sqlalchemy --collect-all jinja2 --collect-all openpyxl --collect-all uvicorn run.py
          if (!(Test-Path "dist/LegkyiZvit.exe")) { throw "PyInstaller did not produce dist/LegkyiZvit.exe" }
          if ((Get-Item "dist/LegkyiZvit.exe").Length -le 1MB) { throw "Executable is unexpectedly small; refusing to publish incomplete output" }

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $env:HOST = "127.0.0.1"
          $env:PORT = "18765"
          $env:LEGKYI_DATA_DIR = Join-Path $env:RUNNER_TEMP "legkyi-smoke-data"
          $stdout = Join-Path $env:RUNNER_TEMP "legkyi-smoke.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "legkyi-smoke.stderr.log"
          $app = Start-Process -FilePath "dist/LegkyiZvit.exe" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $ready = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              if ($app.HasExited) {
                $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
                $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
                throw "Packaged app exited with code $($app.ExitCode). stdout: $out stderr: $err"
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:18765/" -TimeoutSec 2 -UseBasicParsing
                if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) { $ready = $true; break }
              } catch {
                if ($_.Exception.Response) {
                  $statusCode = [int]$_.Exception.Response.StatusCode
                  if ($statusCode -ge 200 -and $statusCode -lt 500) { $ready = $true; break }
                }
              }
              Start-Sleep -Seconds 1
            }
            if (!$ready) {
              $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
              $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
              throw "Packaged app did not become ready within 60 seconds. stdout: $out stderr: $err"
            }
            Write-Host "Packaged Windows executable started and answered HTTP requests."
          } finally {
            if ($app -and !$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: LegkyiZvit-Windows-x64
          path: dist/LegkyiZvit.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish release executable
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/LegkyiZvit.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
