name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - cloud-version
    paths:
      - "app/**"
      - "src/**"
      - "scripts/**"
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout cloud version
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: cloudflare/uv.lock

      - name: Install Worker tooling and app dependencies
        run: uv sync --group dev

      - name: Stage application bundle
        run: uv run --group dev python build.py

      - name: Validate required deployment secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          missing=""
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL SECRET_KEY ADMIN_PASSWORD; do
            case "$key" in
              CLOUDFLARE_API_TOKEN) value="$CF_API_TOKEN" ;;
              CLOUDFLARE_ACCOUNT_ID) value="$CF_ACCOUNT_ID" ;;
              DATABASE_URL) value="$DATABASE_URL" ;;
              SECRET_KEY) value="$SECRET_KEY" ;;
              ADMIN_PASSWORD) value="$ADMIN_PASSWORD" ;;
            esac
            if [ -z "$value" ]; then
              missing="$missing $key"
            fi
          done
          if [ -n "$missing" ]; then
            {
              echo "## Cloudflare deployment is waiting for secrets"
              echo ""
              echo "Add these repository Actions secrets under Settings → Secrets and variables → Actions:"
              for key in $missing; do printf -- '- `%s`\n' "$key"; done
              echo ""
              echo "No deployment was attempted. The Windows/Soup.V3.1 build is unaffected."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Missing required GitHub Actions secrets:$missing" >&2
            exit 1
          fi

      - name: Authenticate Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run --group dev pywrangler whoami

      - name: Upload application secrets to Worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          printf '%s' "$DATABASE_URL" | uv run --group dev pywrangler secret put DATABASE_URL
          printf '%s' "$SECRET_KEY" | uv run --group dev pywrangler secret put SECRET_KEY
          printf '%s' "$ADMIN_PASSWORD" | uv run --group dev pywrangler secret put ADMIN_PASSWORD

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run --group dev pywrangler deploy

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## Cloudflare Worker deployed"
            echo ""
            echo "- URL: https://mourningreport.pp.ua"
            echo "- Branch: cloud-version"
            echo "- Build and deployment ran on GitHub-hosted Ubuntu, not the local Termux/proot environment."
          } >> "$GITHUB_STEP_SUMMARY"
