name: Python and helper tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: poetry.lock
      - name: Install Poetry
        run: python -m pip install "poetry==2.4.3"
      - name: Install locked dependencies
        run: poetry install --no-interaction
      - name: Run Python regression tests
        run: poetry run pytest -q

  go-helper:
    name: Compile Tailscale helper
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: tailscale-helper/go.sum
      - name: Verify helper modules and compile
        working-directory: tailscale-helper
        run: |
          go mod download
          go test ./...
          go build -trimpath -o "$RUNNER_TEMP/tailscale-helper" .
