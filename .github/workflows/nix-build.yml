name: Nix package validation

on:
  push:
    branches:
      - packaging/nix-flake
  pull_request:
    branches:
      - main
      - fix/windows-binary-reliability-tailscale

permissions:
  contents: read

jobs:
  nix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix with flakes
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and lock flake inputs
        run: nix flake lock
      - name: Build the default application package
        id: build
        continue-on-error: true
        run: nix build --show-trace --no-link .#default
      - name: Save generated flake lock and build outcome for review
        if: always()
        run: |
          mkdir -p nix-validation
          cp flake.lock nix-validation/flake.lock
          printf '%s\n' "${{ steps.build.outcome }}" > nix-validation/build-outcome.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-validation
          path: nix-validation/
          retention-days: 7
      - name: Fail if the Nix package did not build
        if: steps.build.outcome != 'success'
        run: exit 1
