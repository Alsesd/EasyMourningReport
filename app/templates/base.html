<!doctype html>
<html lang="uk"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B19" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Легкий звіт">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/app.css">
<title>Легкий звіт</title></head><body class="{% block bodyclass %}{% endblock %}">
{% if user %}<header class="top"><span class="brand">{{ user.store.name if user.store else 'Легкий звіт · Адміністратор' }}</span><form method="post" action="/logout" class="inline-form"><button type="submit" class="link-button">Вийти</button></form></header>{% endif %}
<main>
{% if flash %}<div class="flash {{ flash.kind }}" role="status"><span>{{ flash.text }}</span><button type="button" class="x" aria-label="Закрити" onclick="this.parentNode.remove()">×</button></div>{% endif %}
{% block body %}{% endblock %}</main>
{% if user and user.role == 'admin' %}{% set p = request.url.path %}<nav class="tabs">
<a href="/admin"{% if p == '/admin' %} aria-current="page"{% endif %}>Налаштування</a>
<a href="/admin/reports?period={{ nav_period }}"{% if p.startswith('/admin/reports') %} aria-current="page"{% endif %}>Звіти</a>
<a href="/admin/summary?period={{ nav_period }}"{% if p.startswith('/admin/summary') %} aria-current="page"{% endif %}>Зведений</a>
<a href="/admin/logs"{% if p.startswith('/admin/logs') %} aria-current="page"{% endif %}>Журнал</a></nav>{% endif %}
<script src="/static/app.js" defer></script>
</body></html>
