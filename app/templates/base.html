<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1013" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reports">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/app.css">
<title>Sales reports</title></head><body>
{% if user %}<header class="top"><span class="brand">{{ user.store.name if user.store else 'Admin' }}</span><a href="/logout">Log out</a></header>{% endif %}
<main>{% block body %}{% endblock %}</main>
{% if user and user.role == 'admin' %}{% set p = request.url.path %}<nav class="tabs">
<a href="/admin"{% if p == '/admin' %} aria-current="page"{% endif %}>Setup</a>
<a href="/admin/reports"{% if p.startswith('/admin/reports') %} aria-current="page"{% endif %}>Reports</a>
<a href="/admin/summary"{% if p.startswith('/admin/summary') %} aria-current="page"{% endif %}>Merged</a></nav>{% endif %}
<script>
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js"));
let ip;addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;const b=document.getElementById("install");if(b)b.hidden=false});
document.addEventListener("click",e=>{if(e.target.id==="install"&&ip){ip.prompt();ip=null;e.target.hidden=true}});
</script>
</body></html>
