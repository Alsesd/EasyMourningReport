{% extends "base.html" %}
{% block bodyclass %}has-bar{% endblock %}
{% block body %}
<div class="store-report-app" x-data="storeReportApp('{{ period }}')" x-init="init()" x-cloak>
    <nav class="month-nav" aria-label="Вибір місяця">
        <a x-show="previousPeriod" :href="previousPeriod ? '/report?period=' + previousPeriod : '#'" aria-label="Попередній місяць">← <span x-text="previousPeriod"></span></a>
        <strong class="month-nav-current" x-text="period"></strong>
        <a x-show="nextPeriod" :href="nextPeriod ? '/report?period=' + nextPeriod : '#'" aria-label="Наступний місяць"><span x-text="nextPeriod"></span> →</a>
    </nav>
    <div class="flash" x-show="message" :class="'flash ' + messageKind" role="status" aria-live="polite">
        <span x-text="message"></span><button type="button" class="x" aria-label="Закрити" @click="message = ''">×</button>
    </div>
    <p class="note" x-show="loading">Завантажую звіт…</p>
    <template x-if="report && !loading">
        <div>
            <div class="head"><h1 x-text="period"></h1><span class="pill" :class="'pill ' + report.status" x-text="statusLabel"></span></div>
            <p class="note" x-show="!report.read_only && rows.some(row => row.repriced)">Ціни деяких товарів змінювалися протягом місяця. Для кожної унікальної ціни, що діяла цього місяця, є окремий рядок.</p>
            <div class="card">
                <template x-for="row in rows" :key="row.id">
                    <div class="item lines">
                        <span class="pname" x-text="row.name"></span>
                        <template x-for="input in row.inputs" :key="row.id + '-' + input.price_cents">
                            <label class="prow">
                                <span class="price-tag"><span x-text="formatMoney(input.price_cents)"></span><span x-text="priceLabel(input.label)"></span></span>
                                <input class="qty" type="number" inputmode="numeric" min="0" step="1" :name="'qty_' + row.id + '_' + input.price_cents" x-model.number="input.quantity" @focus="$event.target.select()" :disabled="report.read_only">
                                <span class="sum" x-text="formatMoney(input.quantity * input.price_cents)"></span>
                            </label>
                        </template>
                    </div>
                </template>
                <p class="note" x-show="rows.length === 0">Товарів ще немає. Їх додає адміністратор.</p>
            </div>
            <details class="inactive" x-show="report.inactive_rows.length">
                <summary>Неактивні позиції (<span x-text="report.inactive_rows.length"></span>): уже внесене, змінити не можна · <span x-text="formatMoney(report.inactive_total_cents)"></span></summary>
                <template x-for="(row, index) in report.inactive_rows" :key="row.name + '-' + index">
                    <div class="item two"><span><span x-text="row.name"></span><span class="sub" x-text="row.lines"></span></span><span class="sum" x-text="formatMoney(row.sum_cents)"></span></div>
                </template>
            </details>
            <p class="hint" x-show="!report.read_only"><b>Зберегти чернетку</b> — зберігає кількості, звіт можна далі редагувати. <b>Надіслати звіт</b> — зберігає й блокує його; розблокувати може лише адміністратор.</p>
            <div class="bar">
                <div class="total"><small>Разом</small><b id="total" x-text="formatMoney(totalCents)"></b><span class="dirty" x-show="dirty">Є незбережені зміни</span></div>
                <div class="actions" x-show="!report.read_only">
                    <button type="button" @click="save('draft')" :disabled="saving" x-text="saving ? 'Зберігаю…' : 'Зберегти чернетку'"></button>
                    <button type="button" class="primary" @click="save('submit')" :disabled="saving" x-text="saving ? 'Зберігаю…' : 'Надіслати звіт'"></button>
                </div>
                <span class="sub" x-show="report.read_only">Звіт заблоковано. Щоб змінити його, попросіть адміністратора розблокувати.</span>
            </div>
        </div>
    </template>
</div>
{% endblock %}
