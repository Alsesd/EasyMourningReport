{% extends "base.html" %}{% block body %}
<div class="login"><h1>Легкий звіт</h1><p class="sub">Увійдіть, щоб продовжити.</p>
{% if error %}<p class="note err">{{ error }}</p>{% endif %}
<form method="post" class="stack">
<input name="login" placeholder="Логін" autocomplete="username" autocapitalize="none" autofocus>
<input name="password" type="password" placeholder="Пароль" autocomplete="current-password">
<button class="primary">Увійти</button>
<button id="install" type="button" hidden>Встановити застосунок</button></form>
<p class="sub">iPhone: Поділитися, потім «На екран «Додому»».</p></div>
{% endblock %}
