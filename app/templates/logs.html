{% extends "base.html" %}{% block body %}
<div x-data="adminLogsApp()" x-init="init()" x-cloak>
    <h1>Журнал дій</h1>
    <form class="filters" @submit.prevent="load()">
        <input x-model="login" placeholder="Логін" autocapitalize="none" aria-label="Логін">
        <select x-model="action" aria-label="Тип дії"><option value="">Усі дії</option>
            <template x-for="item in actions" :key="item"><option :value="item" x-text="item"></option></template>
        </select>
        <button type="submit" :disabled="loading">Фільтрувати</button>
    </form>
    <div class="flash" x-show="message" :class="'flash ' + messageKind" role="status" aria-live="polite">
        <span x-text="message"></span><button type="button" class="x" aria-label="Закрити" @click="message = ''">×</button>
    </div>
    <p class="note" x-show="loading">Завантажую журнал…</p>
    <div class="card scroll"><table>
        <thead><tr><th>Час</th><th>Логін</th><th>Роль</th><th>Дія</th><th>Деталі</th><th>IP</th></tr></thead>
        <tbody>
            <template x-for="entry in logs" :key="entry.id"><tr>
                <td x-text="formatTimestamp(entry.ts)"></td><td x-text="entry.login"></td><td x-text="entry.role"></td>
                <td x-text="entry.action"></td><td class="wrap" x-text="entry.detail"></td><td x-text="entry.ip"></td>
            </tr></template>
            <tr x-show="!loading && logs.length === 0"><td colspan="6" class="empty">Записів поки немає.</td></tr>
        </tbody>
    </table></div>
    <p class="sub" x-show="logs.length === 200">Показано останні 200 записів. Використовуйте фільтри, щоб звузити вибірку.</p>
</div>
{% endblock %}
