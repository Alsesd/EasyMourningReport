{% extends "base.html" %}{% block body %}
<div x-data="adminSummaryApp('{{ period }}', {{ 'true' if submitted_only else 'false' }})" x-init="init()" x-cloak>
    <h1>Зведений звіт</h1>
    <div class="month-nav" aria-label="Вибір місяця">
        <a class="step" href="#" @click.prevent="setPeriod(previousPeriod)" aria-label="Попередній місяць">‹</a>
        <input type="month" :value="period" @change="setPeriod($event.target.value)" aria-label="Місяць" pattern="\d{4}-\d{2}">
        <a class="step" href="#" @click.prevent="setPeriod(nextPeriod)" aria-label="Наступний місяць">›</a>
        <label class="chk"><input type="checkbox" x-model="submittedOnly" @change="load()"> Лише надіслані</label>
    </div>
    <div class="flash" x-show="message" :class="'flash ' + messageKind" role="status" aria-live="polite">
        <span x-text="message"></span><button type="button" class="x" aria-label="Закрити" @click="message = ''">×</button>
    </div>
    <p class="note" x-show="loading">Формую зведений звіт…</p>
    <div class="card scroll">
        <table>
            <thead><tr><th>Товар</th><template x-for="store in (summary ? summary.stores : [])" :key="store.id"><th x-text="store.name"></th></template><th>Кількість</th><th>Сума</th></tr></thead>
            <tbody>
                <template x-for="(row, rowIndex) in (summary ? summary.rows : [])" :key="row.name + '-' + row.price_cents + '-' + rowIndex">
                    <tr>
                        <td><span x-text="row.name"></span><span class="sub" x-show="row.note" x-text="'ціна: ' + row.note"></span></td>
                        <template x-for="(cell, cellIndex) in row.cells" :key="cellIndex"><td x-text="cell"></td></template>
                        <td x-text="row.quantity"></td><td x-text="formatMoney(row.sum_cents)"></td>
                    </tr>
                </template>
                <tr x-show="summary && summary.rows.length === 0"><td :colspan="(summary ? summary.stores.length : 0) + 3" class="empty">Даних за цей місяць немає.</td></tr>
            </tbody>
            <tfoot x-show="summary">
                <tr><th>Разом</th><template x-for="(amount, index) in summary.store_totals_cents" :key="index"><th x-text="formatMoney(amount)"></th></template><th></th><th x-text="formatMoney(summary.grand_total_cents)"></th></tr>
            </tfoot>
        </table>
    </div>
    <p><a class="btn" :href="excelUrl">Завантажити Excel (.xlsx)</a></p>
</div>
{% endblock %}
