[project]
name = "easymourningreport-worker"
version = "0.1.0"
description = "Cloudflare Workers deployment for EasyMourningReport"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "sqlmodel==0.0.24",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "openpyxl>=3.1.5",
    "pg8000>=1.30",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

# Optional group for a traditional VPS using the same PostgreSQL database.
server = [
    "uvicorn>=0.30",
]
