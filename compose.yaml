services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mourningreport-app
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LEGKYI_DATA_DIR=/app/data
      - LEGKYI_BACKUPS_DIR=/app/backups
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - DEMO=${DEMO:-0}
      - PUBLIC_URL=${PUBLIC_URL:-}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ${DATA_PATH:-./data}:/app/data
      - ${BACKUPS_PATH:-./backups}:/app/backups
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8000/",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tunnel:
    build:
      context: .
      dockerfile: Dockerfile.tunnel
    container_name: mourningreport-tunnel
    restart: unless-stopped
    network_mode: "service:app"
    depends_on:
      - app
    volumes:
      - ${DATA_PATH:-./data}:/app/data
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - TUNNEL_ENABLED=${TUNNEL_ENABLED:-true}
