services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mourningreport-app
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      LEGKYI_DATA_DIR: /app/data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-}
      DEMO: ${DEMO:-0}
      PUBLIC_URL: ${PUBLIC_URL:-}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - data:/app/data
      - backups:/app/backups
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tunnel:
    build:
      context: .
      dockerfile: Dockerfile.tunnel
    container_name: mourningreport-tunnel
    restart: unless-stopped
    # Share the app network namespace so the supervisor can reach 127.0.0.1:8000.
    network_mode: "service:app"
    depends_on:
      app:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TUNNEL_ENABLED: ${TUNNEL_ENABLED:-true}
      TUNNEL_TARGET_URL: http://127.0.0.1:8000
    volumes:
      - data:/app/data

volumes:
  data:
  backups:
