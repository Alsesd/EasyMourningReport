services:
  db:
    image: postgres:16-alpine
    container_name: mourningreport-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mourningreport}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-mourningreport}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mourningreport-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mourningreport}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-mourningreport}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - LEGKYI_DATA_DIR=/app/data
      - LEGKYI_BACKUPS_DIR=/app/backups
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - DEMO=${DEMO:-0}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - TUNNEL_ENABLED=${TUNNEL_ENABLED:-}
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    ports:
      - "0.0.0.0:${PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${DATA_PATH:-./data}
        target: /app/data
      - type: bind
        source: ${BACKUPS_PATH:-./backups}
        target: /app/backups
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8000/",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
