services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mourningreport-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LEGKYI_DATA_DIR=/app/data
      - LEGKYI_BACKUPS_DIR=/app/backups
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - DEMO=${DEMO:-0}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - TUNNEL_ENABLED=${TUNNEL_ENABLED:-}
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    ports:
      - "0.0.0.0:${PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${DATA_PATH:-./data}
        target: /app/data
      - type: bind
        source: ${BACKUPS_PATH:-./backups}
        target: /app/backups
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8000/",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
